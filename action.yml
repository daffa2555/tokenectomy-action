name: 'Tokenectomy Razor'
author: 'daffa2555'
description: 'Surgically scrub framework frames and redact credentials from CI logs for AI agents.'

branding:
  icon: 'shield'
  color: 'blue'

inputs:
  log-file:
    description: 'Path to raw error log file to sanitize'
    required: false
    default: ''
  output-file:
    description: 'Target path to write sanitized log output'
    required: false
    default: 'sanitized.log'
  version:
    description: 'Release version of Tokenectomy Razor binary'
    required: false
    default: 'v1.1.2'

outputs:
  sanitized-file:
    description: 'Path to sanitized output file'
    value: ${{ steps.run-razor.outputs.sanitized_file }}

runs:
  using: 'composite'
  steps:
    - name: Setup Tokenectomy Razor Binary
      id: setup-razor
      shell: bash
      run: |
        set -euo pipefail
        OS="${RUNNER_OS:-Linux}"
        ARCH="${RUNNER_ARCH:-X64}"
        VERSION="${{ inputs.version }}"

        case "$OS" in
          Linux)
            PLATFORM="linux-amd64"
            BIN_NAME="razor"
            ;;
          macOS)
            if [ "$ARCH" = "ARM64" ]; then
              PLATFORM="macos-arm64"
            else
              PLATFORM="macos-intel"
            fi
            BIN_NAME="razor"
            ;;
          Windows)
            PLATFORM="windows-amd64.exe"
            BIN_NAME="razor.exe"
            ;;
          *)
            echo "Unsupported OS: $OS"
            exit 1
            ;;
        esac

        mkdir -p "${HOME}/.tokenectomy/bin"
        BIN_PATH="${HOME}/.tokenectomy/bin/$BIN_NAME"

        if [ ! -f "$BIN_PATH" ]; then
          echo "Downloading Tokenectomy Razor ($VERSION) for $PLATFORM..."
          URL="https://github.com/daffa2555/Tokenectomy/releases/download/${VERSION}/razor-${PLATFORM}"
          curl -fsSL -o "$BIN_PATH" "$URL"
          chmod +x "$BIN_PATH"
        fi

        echo "RAZOR_BIN=$BIN_PATH" >> "$GITHUB_ENV"

    - name: Surgically Scrub Log
      id: run-razor
      shell: bash
      run: |
        set -euo pipefail
        LOG_FILE="${{ inputs.log-file }}"
        OUT_FILE="${{ inputs.output-file }}"

        if [ -n "$LOG_FILE" ] && [ -f "$LOG_FILE" ]; then
          "$RAZOR_BIN" --scrub --file "$LOG_FILE" > "$OUT_FILE"
        else
          echo "No valid log-file provided. Creating empty output."
          touch "$OUT_FILE"
        fi

        echo "sanitized_file=$OUT_FILE" >> "$GITHUB_OUTPUT"
